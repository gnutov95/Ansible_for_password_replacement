- name: Distribute SSH public key to all hosts
  hosts: linux_hosts
  gather_facts: no
  tasks:
    - name: Ensure .ssh directory exists for {{ target_user }}
      file:
        path: "/home/{{ target_user }}/.ssh"
        state: directory
        mode: '0700'
        owner: "{{ target_user }}"
        group: "{{ target_user }}"

    - name: Add SSH public key to authorized_keys
      lineinfile:
        path: "/home/{{ target_user }}/.ssh/authorized_keys"
        line: "{{ lookup('file', '/home/admin37/.ssh/ansible_key.pub') }}"
        create: yes
        mode: '0600'
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
      # Если файл с ключом не найден на управляющей машине, эта задача упадет.
      # Убедитесь, что вы предварительно выполнили ssh-keygen.

- name: Change user password on all hosts
  hosts: linux_hosts
  become: yes
  gather_facts: no
  tasks:
    - name: Set password for {{ target_user }}
      user:
        name: "{{ target_user }}"
        password: "{{ new_password | password_hash('sha512', password_salt) }}"
        update_password: always
      no_log: true